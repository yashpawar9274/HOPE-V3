name: Build HOPE APK

# Builds the app, runs unit tests and uploads the APK as a downloadable artifact.
# Run it from the GitHub "Actions" tab (Run workflow) or push to main.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Add google-services.json (optional repository secret)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json added from the GOOGLE_SERVICES_JSON secret."
          else
            echo "No GOOGLE_SERVICES_JSON secret: building without Firebase config."
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HOPE-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
