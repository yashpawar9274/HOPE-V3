<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>
*{box-sizing:border-box}
html,body,#orb{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}
body{background:radial-gradient(circle,rgba(0,208,231,.12),rgba(55,27,110,.16) 48%,transparent 72%)}
canvas{display:block;width:100%;height:100%;background:radial-gradient(circle,rgba(9,44,57,.8) 0,rgba(5,20,31,.5) 40%,transparent 70%)}
</style>
</head>
<body>
<div id="orb"><canvas id="canvas"></canvas></div>
<script>
(function(){
  "use strict";
  const canvas=document.getElementById("canvas");
  const gl=canvas.getContext("webgl",{alpha:true,antialias:true,powerPreference:"low-power"})||
    canvas.getContext("experimental-webgl");
  if(!gl)return;
  const vertexSource="attribute vec2 a_position;void main(){gl_Position=vec4(a_position,0.0,1.0);}";
  const fragmentSource=`
precision highp float;
uniform float u_time;
uniform vec2 u_resolution;
uniform float u_state;
vec3 permute(vec3 x){return mod(((x*34.0)+1.0)*x,289.0);}
float snoise(vec2 v){
  const vec4 C=vec4(0.211324865405187,0.366025403784439,-0.577350269189626,0.024390243902439);
  vec2 i=floor(v+dot(v,C.yy));
  vec2 x0=v-i+dot(i,C.xx);
  vec2 i1=x0.x>x0.y?vec2(1.0,0.0):vec2(0.0,1.0);
  vec4 x12=x0.xyxy+C.xxzz;
  x12.xy-=i1;
  i=mod(i,289.0);
  vec3 p=permute(permute(i.y+vec3(0.0,i1.y,1.0))+i.x+vec3(0.0,i1.x,1.0));
  vec3 m=max(0.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.0);
  m=m*m;m=m*m;
  vec3 x=2.0*fract(p*0.0243902439)-1.0;
  vec3 h=abs(x)-0.5;
  vec3 ox=floor(x+0.5);
  vec3 a0=x-ox;
  m*=1.79284291400159-0.85373472095314*(a0*a0+h*h);
  vec3 g;
  g.x=a0.x*x0.x+h.x*x0.y;
  g.yz=a0.yz*x12.xz+h.yz*x12.yw;
  return 130.0*dot(m,g);
}
void main(){
  vec2 st=(gl_FragCoord.xy-0.5*u_resolution.xy)/min(u_resolution.x,u_resolution.y);
  float r=length(st);
  float speed=u_state<0.5?0.9:(u_state<1.5?1.35:(u_state<2.5?0.65:0.22));
  float t=u_time*speed;
  float angle=atan(st.y,st.x);
  float n=snoise(st*3.2+vec2(cos(t*.5),sin(t*.6)));
  float n2=snoise(st*5.0-vec2(sin(t*.7),cos(t*.4)));
  float radius=.385+.018*sin(t*1.5+n);
  float sphere=smoothstep(radius+.035,radius-.035,r);
  vec3 cyan=vec3(.0,.91,1.0);
  vec3 indigo=vec3(.25,.17,.85);
  vec3 violet=vec3(.55,.2,.91);
  vec3 deep=vec3(.015,.07,.12);
  float flow=sin(r*18.0-t*2.0+n*3.0)*.5+.5;
  float swirl=cos(angle*3.0+t+n2*2.5)*.5+.5;
  vec3 color=mix(indigo,cyan,flow);
  color=mix(color,violet,swirl*.48);
  color=mix(color,deep,smoothstep(.1,.43,r)*.72);
  float core=exp(-r*9.0)*.38;
  float halo=exp(-r*4.1)*.27;
  float rim=smoothstep(.49,.37,r)*smoothstep(.31,.40,r);
  float brightness=u_state>2.5?.55:1.0;
  vec3 finalColor=(color*sphere+cyan*core+cyan*rim*.35)*brightness;
  float alpha=clamp(sphere*.96+halo+rim*.38,0.0,.96)*brightness;
  gl_FragColor=vec4(finalColor,alpha);
}`;
  function compile(type,source){
    const shader=gl.createShader(type);
    gl.shaderSource(shader,source);
    gl.compileShader(shader);
    if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS)){
      console.error("HOPE call orb shader failed:",gl.getShaderInfoLog(shader));
      gl.deleteShader(shader);
      return null;
    }
    return shader;
  }
  const vertex=compile(gl.VERTEX_SHADER,vertexSource);
  const fragment=compile(gl.FRAGMENT_SHADER,fragmentSource);
  if(!vertex||!fragment)return;
  const program=gl.createProgram();
  gl.attachShader(program,vertex);
  gl.attachShader(program,fragment);
  gl.linkProgram(program);
  if(!gl.getProgramParameter(program,gl.LINK_STATUS)){
    console.error("HOPE call orb program failed:",gl.getProgramInfoLog(program));
    return;
  }
  gl.useProgram(program);
  const buffer=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const position=gl.getAttribLocation(program,"a_position");
  gl.enableVertexAttribArray(position);
  gl.vertexAttribPointer(position,2,gl.FLOAT,false,0,0);
  const time=gl.getUniformLocation(program,"u_time");
  const resolution=gl.getUniformLocation(program,"u_resolution");
  const state=gl.getUniformLocation(program,"u_state");
  let currentState=0;
  const states={listening:0,thinking:1,active:2,idle:3,disconnected:4};
  window.HopeCallOrb={setState:function(value){
    if(Object.prototype.hasOwnProperty.call(states,value))currentState=states[value];
  }};
  function resize(){
    const ratio=Math.min(window.devicePixelRatio||1,1.5);
    const width=Math.max(1,Math.floor(canvas.clientWidth*ratio));
    const height=Math.max(1,Math.floor(canvas.clientHeight*ratio));
    if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height;}
  }
  function render(now){
    resize();
    gl.viewport(0,0,canvas.width,canvas.height);
    gl.clearColor(0,0,0,0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(time,now*.001);
    gl.uniform2f(resolution,canvas.width,canvas.height);
    gl.uniform1f(state,currentState);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
